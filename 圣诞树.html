<!DOCTYPE html>
<html lang="zh-CN"> <!-- 改为中文，适配手机端语言 -->
<head>
    <meta charset="UTF-8">
    <!-- 移动端视口核心配置：禁止缩放、适配屏幕 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes"> <!-- 苹果全屏模式 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black"> <!-- 苹果状态栏样式 -->
    <title>圣诞快乐 | 3D记忆树</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fceea7;
            font-family: 'Times New Roman', serif;
            overflow: hidden;
            height: 100vh;
            touch-action: none; /* 禁止移动端默认触摸行为（如双击缩放） */
        }

        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1s ease;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 1px solid #000;
            border-top: 1px solid #d4af37;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            font-size: 16px; /* 手机端缩小字体 */
            color: #d4af37;
            letter-spacing: 2px;
            text-align: center;
            padding: 0 20px;
        }

        h1 {
            position: absolute;
            top: 15px; /* 手机端减少顶部间距 */
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Cinzel', serif;
            font-size: clamp(24px, 8vw, 48px); /* 响应式字体：随屏幕宽度缩放 */
            background: linear-gradient(to right, #fceea7, #d4af37);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.7), 0 0 20px rgba(212, 175, 55, 0.5);
            z-index: 100;
            transition: opacity 0.5s ease;
            text-align: center;
            width: 90%;
        }

        /* 移动端模式切换按钮组：底部固定，横向排列 */
        .mode-buttons {
            position: absolute;
            bottom: 120px; /* 避开上传按钮 */
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px; /* 按钮间距 */
            z-index: 100;
        }

        .mode-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 8px 16px; /* 手机端按钮尺寸 */
            font-size: 14px;
            border-radius: 20px; /* 圆角更友好 */
            backdrop-filter: blur(8px);
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 80px;
        }

        .mode-btn.active {
            background: rgba(212, 175, 55, 0.3);
            transform: scale(1.05);
        }

        .mode-btn:hover {
            background: rgba(212, 175, 55, 0.2);
        }

        .upload-wrapper {
            position: absolute;
            bottom: 30px; /* 手机端减少底部间距 */
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            transition: opacity 0.5s ease;
            width: 90%;
            text-align: center;
        }

        .upload-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            backdrop-filter: blur(8px);
            cursor: pointer;
            transition: all 0.3s ease;
            width: 80%; /* 手机端按钮占宽80% */
            max-width: 300px;
        }

        .upload-btn:hover {
            background: rgba(212, 175, 55, 0.2);
            transform: scale(1.05);
        }

        #file-input {
            display: none;
        }

        .hint-text {
            margin-top: 10px;
            font-size: 12px; /* 手机端缩小提示字体 */
            color: #fceea7;
            text-align: center;
            opacity: 0.8;
            line-height: 1.4;
        }

        .ui-hidden {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* 移除摄像头相关元素（手机端不需要） */
        #webcam-container {
            display: none;
        }

        canvas {
            display: block;
        }

        /* 加载中防止手机端点击 */
        .loader-active {
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <div class="loader-text">加载圣诞魔法中...</div>
    </div>

    <h1>圣诞快乐 | Merry Christmas</h1>

    <!-- 移动端模式切换按钮（替代键盘） -->
    <div class="mode-buttons">
        <button class="mode-btn active" id="tree-mode">圣诞树</button>
        <button class="mode-btn" id="scatter-mode">散落</button>
        <button class="mode-btn" id="focus-mode">聚焦照片</button>
    </div>

    <div class="upload-wrapper">
        <button class="upload-btn" id="upload-btn">添加照片记忆</button>
        <input type="file" id="file-input" accept="image/*">
        <div class="hint-text">点击空白处隐藏控制 | 滑动屏幕旋转场景 | 双指捏合缩放</div>
    </div>

    <!-- 移除摄像头容器（手机端不需要） -->

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        import { PMREMGenerator } from 'three/addons/pmrem/PMREMGenerator.js';
        // 引入轨道控制器（适配移动端触摸）
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 全局状态管理
        const STATE = {
            mode: 'TREE',
            selectedPhoto: null,
            mainGroup: new THREE.Group(),
            particles: [],
            photos: [],
            isUiVisible: true // 控制UI显示/隐藏
        };

        // 移动端性能优化：进一步减少粒子数量
        const PARAMS = {
            mainParticleCount: 300, // 手机端再减少：300（原500）
            dustParticleCount: 600, // 手机端再减少：600（原1000）
            maxTreeRadius: 12, // 缩小圣诞树半径，适配手机屏幕
            maxTreeHeight: 20, // 缩小圣诞树高度
            scatterMinRadius: 6,
            scatterMaxRadius: 18,
            lerpSpeed: 0.05,
            photoScale: 1,
            frameThickness: 0.2,
            zoomSpeed: 0.1, // 缩放速度
            rotateSpeed: 0.05 // 旋转速度
        };

        // 核心渲染对象
        let scene, camera, renderer, composer, controls;
        let clock = new THREE.Clock();
        const loaderElement = document.getElementById('loader');
        const uploadBtn = document.getElementById('upload-btn');
        const fileInput = document.getElementById('file-input');
        const uiElements = document.querySelectorAll('h1, .mode-buttons, .upload-wrapper');
        // 模式按钮
        const treeModeBtn = document.getElementById('tree-mode');
        const scatterModeBtn = document.getElementById('scatter-mode');
        const focusModeBtn = document.getElementById('focus-mode');

        /**
         * 初始化整个场景（适配移动端）
         */
        async function init() {
            // 初始化渲染器（适配移动端像素比）
            renderer = new THREE.WebGLRenderer({ 
                antialias: true,
                powerPreference: 'low-power' // 移动端低功耗模式
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); // 限制像素比，避免性能问题
            renderer.toneMapping = THREE.ReinhardToneMapping;
            renderer.toneMappingExposure = 1.8; // 降低曝光，适配手机屏幕亮度
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.body.appendChild(renderer.domElement);

            // 初始化场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            // 初始化相机（适配移动端视角）
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 40); // 拉近相机，适配手机屏幕

            // 生成环境贴图（简化，提升性能）
            const pmremGenerator = new PMREMGenerator(renderer);
            const roomEnv = new RoomEnvironment();
            const environment = pmremGenerator.fromScene(roomEnv).texture;
            scene.environment = environment;
            roomEnv.dispose();

            // 初始化后期处理（降低bloom强度，适配手机）
            const renderPass = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                0.35, // 降低bloom强度
                0.3,
                0.7
            );
            composer = new EffectComposer(renderer);
            composer.addPass(renderPass);
            composer.addPass(bloomPass);

            // 初始化灯光系统（简化，提升性能）
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xff8c00, 1.5);
            pointLight.position.set(0, 10, 0);
            scene.add(pointLight);

            const spotLight1 = new THREE.SpotLight(0xd4af37, 800); // 降低灯光强度
            spotLight1.position.set(20, 30, 30); // 拉近灯光
            spotLight1.target.position.set(0, 0, 0);
            spotLight1.castShadow = false; // 关闭阴影，提升性能
            scene.add(spotLight1);
            scene.add(spotLight1.target);

            const spotLight2 = new THREE.SpotLight(0x4169e1, 400); // 降低灯光强度
            spotLight2.position.set(-20, 20, -20); // 拉近灯光
            spotLight2.target.position.set(0, 0, 0);
            spotLight2.castShadow = false; // 关闭阴影，提升性能
            scene.add(spotLight2);
            scene.add(spotLight2.target);

            // 添加主群组到场景
            scene.add(STATE.mainGroup);

            // 初始化轨道控制器（支持移动端触摸：滑动旋转、双指缩放）
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; // 阻尼效果，更顺滑
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = false;
            controls.minDistance = 20; // 最小缩放距离
            controls.maxDistance = 80; // 最大缩放距离
            controls.maxPolarAngle = Math.PI / 2; // 禁止旋转到下方

            // 生成粒子、默认照片、初始化交互
            generateParticles();
            createDefaultPhoto();
            initInteractions();

            // 强制隐藏加载动画（手机端1秒后）
            setTimeout(() => {
                loaderElement.style.opacity = 0;
                setTimeout(() => {
                    loaderElement.style.display = 'none';
                    document.body.classList.remove('loader-active');
                }, 1000);
            }, 1000);

            // 启动动画循环
            animate();
        }

        /**
         * 生成各类粒子（主体粒子+尘埃粒子，移动端优化）
         */
        function generateParticles() {
            // 生成主体粒子
            for (let i = 0; i < PARAMS.mainParticleCount; i++) {
                let mesh, type;
                const random = Math.random();

                if (random < 0.3) {
                    // 立方体粒子（金色/深绿色）
                    const geometry = new THREE.BoxGeometry(
                        Math.random() * 0.6 + 0.2, // 缩小尺寸，提升性能
                        Math.random() * 0.6 + 0.2,
                        Math.random() * 0.6 + 0.2
                    );
                    const material = new THREE.MeshStandardMaterial({
                        color: Math.random() > 0.5 ? 0xd4af37 : 0x006400,
                        metalness: Math.random() * 0.8 + 0.2,
                        roughness: Math.random() * 0.3
                    });
                    mesh = new THREE.Mesh(geometry, material);
                    type = 'BOX';
                } else if (random < 0.6) {
                    // 球体粒子（金色/红色，降低分段数）
                    const geometry = new THREE.SphereGeometry(
                        Math.random() * 0.4 + 0.1, // 缩小尺寸
                        12, // 降低分段数（原16）
                        12
                    );
                    const material = new THREE.MeshPhysicalMaterial({
                        color: Math.random() > 0.5 ? 0xd4af37 : 0xff0000,
                        metalness: Math.random() * 0.9 + 0.1,
                        roughness: Math.random() * 0.2,
                        clearcoat: Math.random() > 0.5 ? 0.8 : 0,
                        clearcoatRoughness: 0.1
                    });
                    mesh = new THREE.Mesh(geometry, material);
                    type = 'SPHERE';
                } else {
                    // 糖果手杖粒子（简化模型）
                    mesh = createCandyCane();
                    type = 'CANDY';
                }

                // 绑定粒子的自定义数据
                mesh.userData = {
                    type,
                    t: i / PARAMS.mainParticleCount,
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * 0.01, // 降低速度，适配手机
                        (Math.random() - 0.5) * 0.01,
                        (Math.random() - 0.5) * 0.01
                    ),
                    rotationSpeed: new THREE.Vector3(
                        (Math.random() - 0.5) * 0.01,
                        (Math.random() - 0.5) * 0.01,
                        (Math.random() - 0.5) * 0.01
                    ),
                    targetPosition: new THREE.Vector3(),
                    targetRotation: new THREE.Vector3(),
                    targetScale: new THREE.Vector3(1, 1, 1)
                };

                STATE.particles.push(mesh);
                STATE.mainGroup.add(mesh);
            }

            // 生成尘埃粒子（缩小尺寸，降低数量）
            for (let i = 0; i < PARAMS.dustParticleCount; i++) {
                const geometry = new THREE.SphereGeometry(Math.random() * 0.08 + 0.03, 6, 6); // 更小尺寸，更低分段
                const material = new THREE.MeshStandardMaterial({
                    color: 0xd4af37,
                    metalness: 0.9,
                    roughness: 0.1
                });
                const mesh = new THREE.Mesh(geometry, material);

                mesh.userData = {
                    type: 'DUST',
                    t: Math.random(),
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * 0.005,
                        (Math.random() - 0.5) * 0.005,
                        (Math.random() - 0.5) * 0.005
                    ),
                    rotationSpeed: new THREE.Vector3(
                        (Math.random() - 0.5) * 0.005,
                        (Math.random() - 0.5) * 0.005,
                        (Math.random() - 0.5) * 0.005
                    ),
                    targetPosition: new THREE.Vector3(),
                    targetRotation: new THREE.Vector3(),
                    targetScale: new THREE.Vector3(1, 1, 1)
                };

                STATE.particles.push(mesh);
                STATE.mainGroup.add(mesh);
            }
        }

        /**
         * 生成糖果手杖模型（移动端简化）
         * @returns {THREE.Mesh} 糖果手杖网格
         */
        function createCandyCane() {
            // 生成糖果手杖路径（简化点数）
            const points = [];
            for (let i = 0; i < 8; i++) { // 减少点数（原10）
                points.push(new THREE.Vector3(0, i * 0.5, 0));
            }
            for (let i = 0; i < 4; i++) { // 减少点数（原5）
                const angle = (i / 3) * Math.PI / 2;
                points.push(new THREE.Vector3(
                    Math.sin(angle) * 0.4, // 缩小尺寸
                    4 + Math.cos(angle) * 0.4,
                    0
                ));
            }
            const curve = new THREE.CatmullRomCurve3(points);
            const geometry = new THREE.TubeGeometry(curve, 16, 0.08, 6, false); // 降低分段，缩小半径

            // 生成红白斜纹纹理（简化画布尺寸）
            const canvas = document.createElement('canvas');
            canvas.width = 128; // 缩小画布（原256）
            canvas.height = 32; // 缩小画布（原64）
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 4; // 缩小线条（原8）
            for (let i = -50; i < canvas.width + 50; i += 15) { // 减少线条数量
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i + 30, canvas.height);
                ctx.stroke();
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(2, 1);

            const material = new THREE.MeshStandardMaterial({
                map: texture,
                metalness: 0.1,
                roughness: 0.2
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.scale.set(Math.random() * 0.6 + 0.3, Math.random() * 0.6 + 0.3, Math.random() * 0.6 + 0.3); // 缩小缩放
            return mesh;
        }

        /**
         * 创建默认的圣诞快乐照片（适配中文）
         */
        function createDefaultPhoto() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; // 缩小画布（原512），提升性能
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#d4af37';
            ctx.font = 'bold 24px Cinzel, serif'; // 缩小字体
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('圣诞快乐', canvas.width / 2, canvas.height / 2 - 10);
            ctx.fillText('Merry Christmas', canvas.width / 2, canvas.height / 2 + 20);

            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            addPhotoToScene(texture);
        }

        /**
         * 将照片添加到场景中（带金色相框，移动端优化）
         * @param {THREE.Texture} texture 照片纹理
         */
        function addPhotoToScene(texture) {
            // 照片平面（缩小尺寸）
            const photoGeometry = new THREE.PlaneGeometry(4, 4); // 原5x5，缩小到4x4
            const photoMaterial = new THREE.MeshStandardMaterial({
                map: texture,
                metalness: 0.1,
                roughness: 0.3
            });
            const photoMesh = new THREE.Mesh(photoGeometry, photoMaterial);

            // 金色相框（缩小尺寸）
            const frameGeometry = new THREE.BoxGeometry(
                4 + PARAMS.frameThickness * 2,
                4 + PARAMS.frameThickness * 2,
                PARAMS.frameThickness
            );
            const frameMaterial = new THREE.MeshStandardMaterial({
                color: 0xd4af37,
                metalness: 0.9,
                roughness: 0.1
            });
            const frameMesh = new THREE.Mesh(frameGeometry, frameMaterial);
            frameMesh.position.z = -PARAMS.frameThickness / 2;

            // 照片群组
            const photoGroup = new THREE.Group();
            photoGroup.add(photoMesh);
            photoGroup.add(frameMesh);

            // 绑定自定义数据
            photoGroup.userData = {
                type: 'PHOTO',
                t: Math.random(),
                velocity: new THREE.Vector3(
                    (Math.random() - 0.5) * 0.01,
                    (Math.random() - 0.5) * 0.01,
                    (Math.random() - 0.5) * 0.01
                ),
                rotationSpeed: new THREE.Vector3(
                    (Math.random() - 0.5) * 0.01,
                    (Math.random() - 0.5) * 0.01,
                    (Math.random() - 0.5) * 0.01
                ),
                targetPosition: new THREE.Vector3(),
                targetRotation: new THREE.Vector3(),
                targetScale: new THREE.Vector3(PARAMS.photoScale, PARAMS.photoScale, PARAMS.photoScale)
            };

            STATE.particles.push(photoGroup);
            STATE.photos.push(photoGroup);
            STATE.mainGroup.add(photoGroup);

            // 初始化选中的照片
            if (STATE.photos.length === 1) {
                STATE.selectedPhoto = photoGroup;
            }
        }

        /**
         * 初始化交互事件（移动端触摸优先）
         */
        function initInteractions() {
            // 照片上传（手机端适配）
            uploadBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => {
                const f = e.target.files[0];
                if (f) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        new THREE.TextureLoader().load(ev.target.result, (t) => {
                            t.colorSpace = THREE.SRGBColorSpace;
                            addPhotoToScene(t);
                        });
                    };
                    reader.readAsDataURL(f);
                }
            });

            // 模式按钮点击事件
            treeModeBtn.addEventListener('click', () => {
                setMode('TREE');
                treeModeBtn.classList.add('active');
                scatterModeBtn.classList.remove('active');
                focusModeBtn.classList.remove('active');
            });

            scatterModeBtn.addEventListener('click', () => {
                setMode('SCATTER');
                scatterModeBtn.classList.add('active');
                treeModeBtn.classList.remove('active');
                focusModeBtn.classList.remove('active');
            });

            focusModeBtn.addEventListener('click', () => {
                if (STATE.photos.length > 0) {
                    setMode('FOCUS');
                    focusModeBtn.classList.add('active');
                    treeModeBtn.classList.remove('active');
                    scatterModeBtn.classList.remove('active');
                } else {
                    // 无照片时提示
                    alert('请先添加照片哦～');
                }
            });

            // 点击空白处切换UI显示/隐藏（手机端）
            renderer.domElement.addEventListener('click', () => {
                STATE.isUiVisible = !STATE.isUiVisible;
                uiElements.forEach(el => {
                    el.classList.toggle('ui-hidden', !STATE.isUiVisible);
                });
            });

            // 窗口缩放适配（手机端旋转屏幕）
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                composer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        /**
         * 设置场景模式
         * @param {string} mode 模式名称：TREE/SCATTER/FOCUS
         */
        function setMode(mode) {
            STATE.mode = mode;
            if (mode === 'FOCUS' && STATE.photos.length > 0) {
                STATE.selectedPhoto = STATE.photos[Math.floor(Math.random() * STATE.photos.length)];
            }
        }

        /**
         * 根据当前模式更新粒子目标位置/旋转/缩放
         */
        function updateParticleTargets() {
            switch (STATE.mode) {
                case 'TREE':
                    STATE.particles.forEach((particle) => {
                        const t = particle.userData.t;
                        const radius = PARAMS.maxTreeRadius * (1 - t);
                        const angle = t * 40 * Math.PI; // 减少旋转次数，适配手机
                        particle.userData.targetPosition.set(
                            radius * Math.cos(angle),
                            t * PARAMS.maxTreeHeight - PARAMS.maxTreeHeight / 2,
                            radius * Math.sin(angle)
                        );
                        particle.userData.targetRotation.set(0, 0, 0);
                        particle.userData.targetScale.set(1, 1, 1);
                        if (particle.userData.type === 'PHOTO') {
                            particle.userData.targetScale.set(PARAMS.photoScale, PARAMS.photoScale, PARAMS.photoScale);
                        }
                    });
                    break;
                case 'SCATTER':
                    STATE.particles.forEach((particle) => {
                        const radius = THREE.MathUtils.randFloat(PARAMS.scatterMinRadius, PARAMS.scatterMaxRadius);
                        const randomVec = new THREE.Vector3(
                            Math.random() - 0.5,
                            Math.random() - 0.5,
                            Math.random() - 0.5
                        ).normalize().multiplyScalar(radius);
                        particle.userData.targetPosition.copy(randomVec);
                        particle.userData.targetRotation.set(
                            Math.random() * Math.PI * 2,
                            Math.random() * Math.PI * 2,
                            Math.random() * Math.PI * 2
                        );
                        particle.userData.targetScale.set(1, 1, 1);
                        if (particle.userData.type === 'PHOTO') {
                            particle.userData.targetScale.set(PARAMS.photoScale, PARAMS.photoScale, PARAMS.photoScale);
                        }
                    });
                    break;
                case 'FOCUS':
                    STATE.particles.forEach((particle) => {
                        if (particle === STATE.selectedPhoto) {
                            particle.userData.targetPosition.set(0, 1, 30); // 拉近照片，适配手机
                            particle.userData.targetRotation.set(0, 0, 0);
                            particle.userData.targetScale.set(4, 4, 4); // 缩小照片缩放，适配手机
                        } else {
                            const radius = THREE.MathUtils.randFloat(PARAMS.scatterMinRadius + 3, PARAMS.scatterMaxRadius + 8);
                            const randomVec = new THREE.Vector3(
                                Math.random() - 0.5,
                                Math.random() - 0.5,
                                Math.random() - 0.5
                            ).normalize().multiplyScalar(radius);
                            particle.userData.targetPosition.copy(randomVec);
                            particle.userData.targetRotation.set(
                                Math.random() * Math.PI * 2,
                                Math.random() * Math.PI * 2,
                                Math.random() * Math.PI * 2
                            );
                            particle.userData.targetScale.set(1, 1, 1);
                            if (particle.userData.type === 'PHOTO') {
                                particle.userData.targetScale.set(PARAMS.photoScale * 0.5, PARAMS.photoScale * 0.5, PARAMS.photoScale * 0.5);
                            }
                        }
                    });
                    break;
            }
        }

        /**
         * 主动画循环（适配移动端性能）
         */
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            updateParticleTargets();

            // 更新轨道控制器（移动端触摸）
            controls.update();

            // 平滑更新粒子的位置、旋转、缩放（降低 lerp 频率，提升性能）
            STATE.particles.forEach((particle, index) => {
                // 每N个粒子更新一次，提升性能（可选：index % 2 === 0）
                particle.position.lerp(particle.userData.targetPosition, PARAMS.lerpSpeed);
                particle.scale.lerp(particle.userData.targetScale, PARAMS.lerpSpeed);

                if (STATE.mode === 'SCATTER') {
                    // 散落模式下粒子自转
                    particle.rotation.x += particle.userData.rotationSpeed.x;
                    particle.rotation.y += particle.userData.rotationSpeed.y;
                    particle.rotation.z += particle.userData.rotationSpeed.z;
                } else {
                    // 其他模式下平滑过渡到目标旋转
                    particle.rotation.x = THREE.MathUtils.lerp(particle.rotation.x, particle.userData.targetRotation.x, PARAMS.lerpSpeed);
                    particle.rotation.y = THREE.MathUtils.lerp(particle.rotation.y, particle.userData.targetRotation.y, PARAMS.lerpSpeed);
                    particle.rotation.z = THREE.MathUtils.lerp(particle.rotation.z, particle.userData.targetRotation.z, PARAMS.lerpSpeed);
                }
            });

            // 渲染场景
            composer.render(delta);
        }

        // 启动初始化流程
        init();
    </script>
</body>
</html>
